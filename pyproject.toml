[project]

name = 'pixoo_rest'
description = 'A RESTful API to easily interact with the Wi-Fi enabled Divoom Pixoo devices.'
version = '2.1.1'
readme = 'README.md'

requires-python = '>=3.14'
dependencies = [
    "fastapi[standard]==0.162.1",
    'flask>=3.1.3',
    "pillow==13.0.0",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.33",
    'requests==2.34.2',
]

[dependency-groups]

dev = [
    'ruff>=0.16.0',
    'ty>=0.0.63'
]

[tool.ruff.lint]

select = [
    'E',
    'F',
    'UP',
    'B',
    'SIM',
]

ignore = [
    'E501',
    'F401',
]
